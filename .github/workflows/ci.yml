name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS, verify scoping, typecheck, test
        run: npm run check

      - name: Verify styles.css is up to date
        run: |
          npm run css:build
          if ! git diff --exit-code -- styles.css; then
            echo "::error::styles.css is out of date. Run 'npm run css:build' and commit the result."
            exit 1
          fi

      - name: Production build
        run: npm run build
